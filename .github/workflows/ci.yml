name: CI

on:
  push:
  pull_request:

jobs:
  # Also the job that runs the pairing harness, and the only one that can:
  # `swift test` picks it up with no wiring of its own, and it needs BOTH
  # halves of the project on one machine -- the Swift side links AppKit and
  # does not build on Linux, and the agent is `python3 agent/clipwire-agent.py`
  # spawned from the test, forking the fakes in Tests/fakes by name through
  # PATH. python3 is preinstalled on the GitHub macOS images; the harness
  # resolves it through `/usr/bin/env` rather than assuming a path, because
  # there is no fixed one on macOS.
  swift:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: The fakes' own tests
        # Before `swift test`, deliberately. These pin what a fake can get
        # wrong SILENTLY -- an Update line the agent's parser rejects, a
        # substitution that returns its input -- and every one of those
        # leaves the harness green while it tests nothing. Run first, a
        # broken fake is diagnosed as a broken fake; run after (or not at
        # all, which is where they were until this task), it arrives as a
        # mysterious harness timeout, or as no failure whatsoever.
        #
        # Here rather than in the Python matrix below: the fakes exist to
        # serve the harness, so they belong on the machine the harness runs
        # on, and the matrix is about the interpreter versions the PC
        # actually has.
        run: python3 Tests/fakes/test_fakes.py
      - run: swift build
      - run: swift test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Both legs always run: when the floor breaks and production does not
      # (or the reverse), which one broke IS the finding.
      fail-fast: false
      matrix:
        # 3.14 is what the PC actually runs -- measured, not assumed: the
        # first real deployment's `clipwire install` self-test reported
        # "ok python 3.14.4" on a box the plan had recorded as 3.13. 3.11 is
        # the floor the design doc promises and nothing verified before this;
        # 3.13 stays because the two of them bracket the range the agent is
        # claimed to run on. A bare `python3` here tested only whatever
        # ubuntu-latest happened to ship, which was none of the three. Quoted,
        # because unquoted YAML reads these as floats and a future "3.10"
        # would become 3.1.
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Confirm python3 is the matrix version
        # Every step below invokes `python3`, which setup-python points at
        # the selected interpreter. Assert that rather than trust it: if it
        # ever stopped happening, both legs would quietly retest the runner's
        # own python3 and the matrix would prove nothing while staying green.
        run: |
          python3 --version
          python3 -c 'import sys; assert "%d.%d" % sys.version_info[:2] == "${{ matrix.python-version }}", sys.version'
      - name: Byte-compile the agent
        run: python3 -m compileall -q agent/clipwire-agent.py
      - name: Unit tests
        # No -t: agent/tests has no __init__.py, and unittest's discover
        # requires an importable start dir whenever it differs from the top
        # level. With -t agent this fails with "Start directory is not
        # importable".
        run: python3 -m unittest discover -s agent/tests -v
      - name: Install clipboard tools
        run: sudo apt-get update && sudo apt-get install -y wl-clipboard
      - name: Agent self-test
        run: python3 agent/clipwire-agent.py --selftest
