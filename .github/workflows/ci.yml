name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Both legs always run: when the floor breaks and production does not
      # (or the reverse), which one broke IS the finding.
      fail-fast: false
      matrix:
        # 3.13 is what the PC actually runs, so it is the version under
        # test. 3.11 is the floor the design doc promises and nothing
        # verified before this: a bare `python3` here tested only whatever
        # ubuntu-latest happened to ship, which is neither. Quoted, because
        # unquoted YAML reads these as floats and a future "3.10" would
        # become 3.1.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Confirm python3 is the matrix version
        # Every step below invokes `python3`, which setup-python points at
        # the selected interpreter. Assert that rather than trust it: if it
        # ever stopped happening, both legs would quietly retest the runner's
        # own python3 and the matrix would prove nothing while staying green.
        run: |
          python3 --version
          python3 -c 'import sys; assert "%d.%d" % sys.version_info[:2] == "${{ matrix.python-version }}", sys.version'
      - name: Byte-compile the agent
        run: python3 -m compileall -q agent/clipwire-agent.py
      - name: Unit tests
        # No -t: agent/tests has no __init__.py, and unittest's discover
        # requires an importable start dir whenever it differs from the top
        # level. With -t agent this fails with "Start directory is not
        # importable".
        run: python3 -m unittest discover -s agent/tests -v
      - name: Install clipboard tools
        run: sudo apt-get update && sudo apt-get install -y wl-clipboard
      - name: Agent self-test
        run: python3 agent/clipwire-agent.py --selftest
